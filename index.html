async function initFirebase(){
  if(!firebaseEnabled)return;
  try{
    const appMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
    const authMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js");
    const fsMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js");

    const app=appMod.initializeApp(firebaseConfig);
    auth=authMod.getAuth(app);
    db=fsMod.getFirestore(app);
    GoogleAuthProviderClass=authMod.GoogleAuthProvider;
    signInWithPopupFn=authMod.signInWithPopup;
    signInWithRedirectFn=authMod.signInWithRedirect;
    signOutFn=authMod.signOut;
    docFn=fsMod.doc;
    getDocFn=fsMod.getDoc;
    setDocFn=fsMod.setDoc;
    serverTimestampFn=fsMod.serverTimestamp;

    await authMod.setPersistence(auth,authMod.browserLocalPersistence);

    authMod.onAuthStateChanged(auth,async user=>{
      currentUser=user;
      updateLoginUI();

      if(!user){
        setLoginStatus("Local save");
        if(activeScreen==="home")home();
        return;
      }

      setLoginStatus("Syncing…");
      try{
        const snap=await getDocFn(docFn(db,"users",user.uid));
        if(snap.exists()&&snap.data().progress){
          prog=mergeProgress(prog,snap.data().progress);
        }
        await save();
        if(activeScreen==="home")home();
      }catch(error){
        console.error(error);
        setLoginStatus("Cloud sync failed",true);
      }
    });
  }catch(error){
    console.error(error);
    setLoginStatus("Firebase failed to load",true);
  }
}

function totalXpForLevel(level){
  if(level<=1)return 0;
  return Math.round(100*Math.pow(level-1,2.15));
}

function lvl(xp){
  xp=Math.max(0,Number(xp)||0);

  // Estimate the level, then correct for rounding.
  let level=Math.max(1,Math.floor(Math.pow(xp/100,1/2.15))+1);

  while(totalXpForLevel(level+1)<=xp)level++;
  while(level>1&&totalXpForLevel(level)>xp)level--;

  return level;
}

function levelProgress(xp){
  const level=lvl(xp);
  const start=totalXpForLevel(level);
  const next=totalXpForLevel(level+1);
  const gained=Math.max(0,xp-start);
  const needed=Math.max(1,next-start);

  return {
    level,
    gained,
    needed,
    next,
    percent:Math.max(0,Math.min(100,(gained/needed)*100))
  };
}

function mergeProgress(local,cloud){
  return {
    ...def,
    xp:Math.max(local.xp||0,cloud.xp||0),
    rooms:Math.max(local.rooms||0,cloud.rooms||0),
    guessed:Math.max(local.guessed||0,cloud.guessed||0),
    streak:Math.max(local.streak||0,cloud.streak||0),
    best:Math.max(local.best||0,cloud.best||0),
    cases:Math.max(local.cases||0,cloud.cases||0),
    games:Math.max(local.games||0,cloud.games||0),
    recent:[...new Set([...(cloud.recent||[]),...(local.recent||[])])].slice(-14),
    difficulty:local.difficulty||cloud.difficulty||"agent"
  };
}

async function save(){
  localStorage.setItem("shield-v4",JSON.stringify(prog));
  document.getElementById("xp").textContent=prog.xp.toLocaleString();
  document.getElementById("lvl").textContent=lvl(prog.xp);

  if(currentUser&&db){
    try{
      await setDocFn(docFn(db,"users",currentUser.uid),{progress:prog,updatedAt:serverTimestampFn()},{merge:true});
      setLoginStatus("Cloud saved");
    }catch(error){
      console.error(error);
      setLoginStatus("Local save only",true);
    }
  }
}

function updateLoginUI(){
  const button=document.getElementById("loginBtn");
  if(!button)return;
  button.textContent=currentUser
    ? `Sign out · ${currentUser.displayName?.split(" ")[0]||"Agent"}`
    : firebaseEnabled ? "Sign in with Google" : "Set up Google login";
}

async function authClick(){
  if(!firebaseEnabled){
    alert("Google login code is ready, but Firebase is not connected yet. Paste your Firebase web config into the top of index.html first.");
    return;
  }

  await firebaseReady;

  if(currentUser){
    await signOutFn(auth);
    return;
  }

  const provider=new GoogleAuthProviderClass();
  provider.setCustomParameters({prompt:"select_account"});

  try{
    await signInWithPopupFn(auth,provider);
  }catch(error){
    console.error(error);
    if(error?.code==="auth/popup-blocked"||error?.code==="auth/cancelled-popup-request"){
      await signInWithRedirectFn(auth,provider);
      return;
    }
    alert("Google sign-in failed. Check Firebase Authentication and authorised domains.");
  }
}

function fresh(){let a=characters.filter(c=>!prog.recent.includes(c.name));return rnd(a.length?a:characters)}
function home(){
 activeScreen="home";
 save();
 updateLoginUI();
 const diff=difficulties[prog.difficulty];
 const agentName=currentUser?.displayName?.split(" ")[0]||"Agent";
 const levelData=levelProgress(prog.xp);
 screen.innerHTML=`<section class="hero"><div><p class="eyebrow">SECURE CONNECTION ESTABLISHED</p><h1>Welcome, ${esc(agentName)}.</h1><p class="lede">Three procedural Marvel training modules. ${currentUser?"Progress is synced to your Google account.":"Progress currently saves on this device."}</p></div><div class="card"><span style="color:var(--muted);font-size:.72rem;letter-spacing:.12em">CLEARANCE LEVEL</span><strong style="float:right;color:var(--accent);font-size:2rem">${levelData.level}</strong><div class="progress"><span style="width:${levelData.percent}%"></span></div><small style="color:var(--muted)">${prog.xp.toLocaleString()} total XP · ${levelData.gained.toLocaleString()} / ${levelData.needed.toLocaleString()} XP to next level · ${diff.name} identity mode</small></div></section>
 <section class="gamegrid">
 <button class="game" data-g="e"><span class="num">01</span><strong>Escape Protocol</strong><p>Break out by solving randomly assembled Marvel locks.</p><span class="meta">${prog.rooms} rooms escaped</span></button>
 <button class="game" data-g="g"><span class="num">02</span><strong>Identity Analysis</strong><p>Choose a difficulty and identify a character from carefully ordered clues.</p><span class="meta">Best streak: ${prog.best}</span></button>
 <button class="game" data-g="d"><span class="num">03</span><strong>Classified Database</strong><p>Search personnel records and solve generated S.H.I.E.L.D. cases.</p><span class="meta">${prog.cases} cases solved</span></button>
 </section>`;
 document.querySelector('[data-g="e"]').onclick=escapeGame;
 document.querySelector('[data-g="g"]').onclick=difficultyMenu;
 document.querySelector('[data-g="d"]').onclick=dbGame;
}
function pickOthers(arr,x,n){return sh(arr.filter(v=>v!==x)).slice(0,n)}
function escapeGame(){
 prog.games++;save();
 let theme=rnd(themes),puzzles=[];
 let c=rnd(characters), alias=rnd(c.aliases);
 puzzles.push({q:`IDENTITY LOCK: Which person uses the alias “${alias}”?`,a:c.name,o:sh([c.name,...pickOthers(characters,c,3).map(x=>x.name)])});
 let art=rnd(artifacts);puzzles.push({q:`EQUIPMENT LOCK: ${art.clue}`,a:art.name,o:sh([art.name,...pickOthers(artifacts,art,3).map(x=>x.name)])});
 let ev=rnd(events);puzzles.push({q:`DATE LOCK: In what year did “${ev[0]}” occur?`,a:String(ev[1]),num:true});
 let pc=rnd(characters.filter(x=>x.powers.length));let power=rnd(pc.powers);
 puzzles.push({q:`BIOMETRIC LOCK: Whose file contains “${power}”?`,a:pc.name,o:sh([pc.name,...pickOthers(characters,pc,3).map(x=>x.name)])});
 puzzles=sh(puzzles);let i=0,mist=0;
 function render(msg=""){
   if(i>=puzzles.length){let gain=Math.max(30,90-mist*10);prog.xp+=gain;prog.rooms++;save();screen.innerHTML=`<section class="mission"><p class="eyebrow">ESCAPE CONFIRMED</p><h1>${esc(theme)} cleared.</h1><p>${mist} mistake${mist===1?"":"s"}.</p><div class="reward">+${gain} XP</div><div class="row"><button class="btn primary" id="again">Generate another room</button><button class="btn" id="back">Terminal</button></div></section>`;document.getElementById("again").onclick=escapeGame;document.getElementById("back").onclick=home;return}
   let p=puzzles[i],input=p.num?`<form class="form" id="nf"><input id="ni" inputmode="numeric" placeholder="Enter year" required><button class="btn primary">Unlock</button></form>`:`<div class="choices">${p.o.map(x=>`<button class="choice" data-a="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
   screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">ESCAPE PROTOCOL · ${esc(theme)}</p><h1>Lock ${i+1}/${puzzles.length}</h1></div></div><section class="mission"><h2>${esc(p.q)}</h2>${input}<p class="feedback" id="fb">${esc(msg)}</p></section>`;
   document.getElementById("b").onclick=home;
   function check(a){if(norm(a)===norm(p.a)){i++;render("ACCESS GRANTED")}else{mist++;document.getElementById("fb").textContent="ACCESS DENIED. Try again."}}
   document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>check(b.dataset.a));
   if(document.getElementById("nf"))document.getElementById("nf").onsubmit=e=>{e.preventDefault();check(document.getElementById("ni").value)}
 }
 render();
}
function difficultyMenu(){
 activeScreen="difficulty";
 screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">IDENTITY ANALYSIS</p><h1>Select difficulty</h1></div></div>
 <section class="mission">
 <div class="notice">Aliases are never shown as clues. The final clue is deliberately easy, but still indirect.</div>
 <div class="difficultygrid">
 ${Object.entries(difficulties).map(([key,d])=>`<button class="difficulty ${prog.difficulty===key?"selected":""}" data-diff="${key}"><strong>${d.name}</strong><span>${d.multiplier}× XP</span><p>${d.description}</p></button>`).join("")}
 </div></section>`;
 document.getElementById("b").onclick=home;
 document.querySelectorAll("[data-diff]").forEach(button=>button.onclick=async()=>{
   prog.difficulty=button.dataset.diff;
   await save();
   guessGame();
 });
}

function buildClues(c,key){
 const all={
   species:`CLASSIFICATION: Species — ${c.species}`,
   affiliation:`AFFILIATION: Records connect the subject to ${rnd(c.aff)}.`,
   associate:`KNOWN ASSOCIATE: ${rnd(c.assoc)}.`,
   power:`CAPABILITY: ${rnd(c.powers)}.`,
   location:`LOCATION OF INTEREST: ${rnd(c.loc)}.`,
   year:`FIRST MCU APPEARANCE YEAR: ${c.year}.`,
   equipment:`EQUIPMENT PROFILE: The subject is associated with ${c.safeGear}.`,
   quote:c.quote?`ARCHIVED DIALOGUE: “${c.quote}”`:null
 };

 let keys=
   key==="recruit" ? ["species","affiliation","power","equipment"] :
   key==="agent" ? ["year","associate","location","power"] :
   key==="expert" ? ["quote","location","associate","equipment"] :
                    ["quote","location","year","associate"];

 let first=keys.map(k=>all[k]).filter(Boolean);
 const fallback=sh(Object.values(all).filter(Boolean));

 for(const clue of fallback){
   if(first.length>=4)break;
   if(!first.includes(clue))first.push(clue);
 }

 first=sh(first.slice(0,4));
 return [...first,`FINAL LIFELINE: ${c.finalEasy}`];
}

function guessGame(){
 activeScreen="guess";
 prog.games++;
 save();

 const c=fresh();
 const d=difficulties[prog.difficulty];
 const clues=buildClues(c,prog.difficulty);
 let n=1,done=false;

 function pts(){
   if(n>=clues.length)return 0;
   return d.points[Math.min(n-1,d.points.length-1)];
 }

 function render(msg=""){
   screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">IDENTITY ANALYSIS · ${d.name.toUpperCase()}</p><h1>Unknown subject</h1></div><div class="reward">STREAK ${prog.streak}</div></div>
   <section class="mission"><div class="reward">${n>=clues.length?"FINAL LIFELINE · 0 XP":`${pts()} points · ${d.multiplier}× XP`}</div>
   <div class="clues">${clues.map((x,i)=>`<div class="clue ${i<n?"":"hidden"}"><span>${i===4?"FINAL CLUE":`CLUE ${i+1}`}</span><div>${i<n?esc(x):"████████████████"}</div></div>`).join("")}</div>
   <form class="form" id="gf"><input id="gi" placeholder="Character name or alias" autocomplete="off" ${done?"disabled":""} required><button class="btn primary" ${done?"disabled":""}>Submit</button></form>
   <div class="row"><button class="btn" id="more" ${n>=5||done?"disabled":""}>Reveal another clue</button>${done?'<button class="btn primary" id="next">Next subject</button><button class="btn" id="change">Change difficulty</button>':""}</div>
   <p class="feedback" id="fb">${esc(msg)}</p></section>`;

   document.getElementById("b").onclick=home;
   document.getElementById("more").onclick=()=>{n=Math.min(5,n+1);render()};

   if(done){
     document.getElementById("next").onclick=guessGame;
     document.getElementById("change").onclick=difficultyMenu;
   }

   document.getElementById("gf").onsubmit=async e=>{
     e.preventDefault();
     if(done)return;

     const a=document.getElementById("gi").value;
     const ok=[c.name,...c.aliases].some(x=>norm(x)===norm(a));

     if(ok){
       done=true;
       const gain=n>=clues.length ? 0 : Math.round(pts()*8*d.multiplier);
       prog.xp+=gain;
       prog.guessed++;
       prog.streak++;
       prog.best=Math.max(prog.best,prog.streak);
       prog.recent=[...prog.recent,c.name].slice(-14);
       await save();
       render(
         gain>0
           ? `IDENTITY CONFIRMED: ${c.name} · +${gain} XP`
           : `IDENTITY CONFIRMED: ${c.name} · final lifeline used, so +0 XP`
       );
     }else{
       prog.streak=0;
       await save();
       if(n>=5){
         done=true;
         render(`SUBJECT REVEALED: ${c.name}`);
       }else{
         document.getElementById("fb").textContent="IDENTITY REJECTED. Guess again or reveal another clue.";
       }
     }
   };
 }
 render();
}
function dbGame(){
 prog.games++;save();let s=fresh(),cl=sh([
 `The subject has been connected to ${rnd(s.aff)}.`,
 `A recovered file lists ${rnd(s.assoc)} as a known associate.`,
 `The subject has demonstrated ${rnd(s.powers)}.`,
 `The investigation references ${rnd(s.loc)}.`,
 `The subject's first MCU appearance year is ${s.year}.`,
 s.gear.length?`Equipment analysis mentions ${rnd(s.gear)}.`:`No signature equipment appears in the recovered manifest.`,
 `Classification lists the subject as ${s.species}.`
 ]).slice(0,4);let q="",sel="";
 function filtered(){if(!q)return characters;let n=norm(q);return characters.filter(c=>norm([c.name,...c.aliases,...c.aff,...c.powers,...c.gear,...c.assoc,...c.loc,c.species,c.year].join(" ")).includes(n))}
 function render(msg=""){let rs=filtered();screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">CLASSIFIED DATABASE</p><h1>Active case</h1></div></div><section class="casegrid"><aside class="case"><p class="eyebrow">ACTIVE INVESTIGATION</p><h2>Identify the unknown subject.</h2><p>Use the evidence and search the personnel database.</p><div class="evidence">${cl.map((x,i)=>`<div><span>EVIDENCE ${i+1}</span><p>${esc(x)}</p></div>`).join("")}</div></aside><section class="db"><form class="search" id="sf"><input id="si" placeholder="Search name, alias, power, team, location…" value="${esc(q)}"><button class="btn">Search</button></form><div class="results">${rs.map(c=>`<button class="person ${sel===c.name?"sel":""}" data-p="${esc(c.name)}"><strong>${esc(c.name)}</strong><small>${esc(c.aliases[0]||"")}</small><p>${esc(c.species)} · ${esc(c.aff.join(", "))}<br>${esc(c.powers.slice(0,2).join(", "))}</p></button>`).join("")}</div><div class="row"><button class="btn primary" id="acc" ${sel?"":"disabled"}>Submit selected identity</button></div><p class="feedback" id="fb">${esc(msg)}</p></section></section>`;
 document.getElementById("b").onclick=home;document.getElementById("sf").onsubmit=e=>{e.preventDefault();q=document.getElementById("si").value;render()};document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{sel=b.dataset.p;render()});document.getElementById("acc").onclick=()=>{if(sel===s.name){prog.xp+=80;prog.cases++;prog.recent=[...prog.recent,s.name].slice(-12);save();screen.innerHTML=`<section class="mission"><p class="eyebrow">CASE CLOSED</p><h1>${esc(s.name)} identified.</h1><div class="reward">+80 XP</div><div class="row"><button class="btn primary" id="new">Generate new case</button><button class="btn" id="home">Terminal</button></div></section>`;document.getElementById("new").onclick=dbGame;document.getElementById("home").onclick=home}else document.getElementById("fb").textContent="IDENTITY REJECTED. Re-check the evidence."}}
 render();
}
document.getElementById("homeBtn").onclick=home;
document.getElementById("loginBtn").onclick=authClick;
updateLoginUI();
home();
</script>
