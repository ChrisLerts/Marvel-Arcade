<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>S.H.I.E.L.D. Marvel Arcade</title>
  <style>
    :root{
      --bg:#05070a;--panel:#0d1319;--panel2:#111b24;--line:#263742;
      --text:#edf5f7;--muted:#91a4ad;--accent:#6fd8ff;--ok:#95e8bf;--bad:#ff9d9d
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 20% 0,#10202a 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}
    button{color:inherit}
    .top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:#05070ae8;backdrop-filter:blur(12px)}
    .brand{display:flex;gap:10px;align-items:center;background:none;border:0;cursor:pointer;text-align:left}
    .mark{display:grid;place-items:center;width:38px;height:42px;border:1px solid var(--accent);border-radius:10px 10px 18px 18px;color:var(--accent);font-weight:900}
    .brand strong{display:block;letter-spacing:.14em}.brand small{display:block;color:var(--muted);font-size:.64rem;letter-spacing:.14em;margin-top:2px}
    .stats{display:flex;gap:8px;align-items:center}
    .pill{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#0b1116}.pill span{display:block;color:var(--muted);font-size:.58rem;letter-spacing:.12em}.pill strong{font-size:.9rem}
    main{width:min(1120px,calc(100% - 24px));margin:0 auto;padding:38px 0 48px}
    .hero{display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:end}
    .eyebrow{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.18em;margin:0 0 8px}
    h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:0 0 12px;letter-spacing:-.035em}
    h2{line-height:1.2}.lede{color:var(--muted);line-height:1.65;max-width:700px}
    .card,.mission,.case,.db{border:1px solid var(--line);background:linear-gradient(145deg,#101820,#080d11);border-radius:18px}
    .card{padding:18px}.progress{height:7px;background:#1d2830;border-radius:999px;overflow:hidden;margin:14px 0 8px}.progress span{display:block;height:100%;background:var(--accent)}
    .gamegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:24px}
    .game{min-height:230px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#0b1116;cursor:pointer;text-align:left;position:relative}
    .game:hover{border-color:#47697a;background:#0f171e}.game strong{display:block;margin-top:36px;font-size:1.28rem}.game p{color:var(--muted);line-height:1.55}.num{color:#607985;font-size:.7rem;letter-spacing:.14em}.meta{position:absolute;left:20px;right:20px;bottom:18px;border-top:1px solid var(--line);padding-top:12px;color:#b5c5cc;font-size:.8rem}
    .mission{max-width:820px;margin:0 auto;padding:24px}.missionhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}
    .back,.btn,.choice{min-height:44px;border-radius:10px;cursor:pointer}
    .back{border:0;background:none;color:var(--muted);padding:8px}
    .btn{padding:10px 15px;border:1px solid var(--line);background:#101820;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#051018}.btn:disabled{opacity:.45;cursor:not-allowed}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.choice{padding:14px;border:1px solid var(--line);background:#091015;text-align:left}.choice:hover{border-color:#4c7182}
    .feedback{min-height:24px;color:#b1c1c8;margin-top:16px}.form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}.form input,.search input{min-height:46px;border-radius:10px;border:1px solid var(--line);background:#05090c;color:var(--text);padding:10px 12px;font-size:16px;width:100%}
    .clues{display:grid;gap:8px;margin:16px 0}.clue{border:1px solid var(--line);border-radius:12px;padding:13px}.clue span{display:block;color:var(--muted);font-size:.64rem;letter-spacing:.14em;margin-bottom:6px}.hidden{opacity:.35}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.reward{display:inline-block;padding:8px 12px;border:1px solid #355364;border-radius:10px;color:var(--accent);font-weight:800;margin:8px 0}
    .casegrid{display:grid;grid-template-columns:.7fr 1.3fr;gap:14px}.case,.db{padding:20px}.case p{color:var(--muted);line-height:1.55}.evidence{display:grid;gap:8px;margin-top:18px}.evidence div{border-left:2px solid var(--accent);background:#6fd8ff0a;padding:10px}.evidence span{font-size:.62rem;color:var(--muted);letter-spacing:.12em}
    .search{display:grid;grid-template-columns:1fr auto;gap:8px}.results{display:grid;gap:8px;max-height:560px;overflow:auto;margin-top:12px}.person{border:1px solid var(--line);border-radius:12px;background:#091015;padding:13px;text-align:left;cursor:pointer}.person.sel{border-color:var(--accent);background:#6fd8ff10}.person strong{display:block}.person small{color:var(--accent)}.person p{font-size:.78rem;color:#c5d1d6;margin:7px 0 0;line-height:1.4}

    .topright{display:flex;align-items:center;gap:8px}
    .quote-box{padding:22px;border:1px solid var(--line);border-radius:14px;background:#071016;margin:18px 0}
    .quote-box blockquote{margin:0;font-size:clamp(1.2rem,3vw,1.8rem);line-height:1.45;font-weight:700}
    .quote-box small{display:block;color:var(--muted);margin-top:12px;letter-spacing:.12em}
    .artifact-clue-stack{display:grid;gap:8px;margin:18px 0}

    .inventory-btn{position:relative}
    .inventory-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:5px;border-radius:999px;background:var(--accent);color:#051018;font-size:.68rem;font-weight:900}
    .inventory-summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
    .inventory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:16px}
    .inventory-item{padding:15px;border:1px solid var(--line);border-radius:14px;background:#091015}
    .inventory-item-top{display:flex;gap:12px;align-items:flex-start}
    .artifact-icon{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:#060c10;color:var(--accent)}
    .artifact-icon svg{width:34px;height:34px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .artifact-icon svg .fill{fill:currentColor;stroke:none;opacity:.9}
    .artifact-icon svg .soft{opacity:.45}
    .inventory-item-copy{min-width:0;flex:1}
    .inventory-item strong{display:block;font-size:1rem}.inventory-item span{display:block;color:var(--accent);font-size:.72rem;margin-top:4px}
    .inventory-item p{color:var(--muted);font-size:.8rem;line-height:1.45;margin:8px 0 0}
    .rarity{display:inline-block;margin-top:8px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:.64rem;font-weight:900;letter-spacing:.09em}
    .rarity-common{opacity:.78}
    .rarity-uncommon{border-color:#4d7a64}
    .rarity-rare{border-color:#496a8d}
    .rarity-epic{border-color:#75548d}
    .rarity-legendary{border-color:#8d7348}
    .rarity-mythic{border-color:#8b4b5f}
    .new-reward{padding:12px 14px;border-left:2px solid var(--ok);background:rgba(149,232,191,.06);color:#ccebdd;margin:18px 0}
    .grid-status{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .grid-chip{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#0a1116;font-size:.78rem}
    .marvel-grid-wrap{overflow-x:auto;padding-bottom:4px}
    .marvel-grid{display:grid;grid-template-columns:120px repeat(3,minmax(120px,1fr));gap:6px;min-width:520px}
    .grid-corner,.grid-head,.grid-rowhead,.grid-cell{min-height:92px;border:1px solid var(--line);border-radius:12px;background:#091015;padding:10px}
    .grid-corner{display:grid;place-items:center;color:var(--muted);font-size:.68rem;letter-spacing:.12em}
    .grid-head,.grid-rowhead{display:grid;place-items:center;text-align:center;color:#c9d6db;font-size:.78rem;font-weight:800}
    .grid-cell{cursor:pointer;display:grid;place-items:center;text-align:center;position:relative}
    .grid-cell:hover{border-color:#4c7182}.grid-cell.selected{border-color:var(--accent);background:#6fd8ff0d}
    .grid-cell.filled{border-color:#497565;background:rgba(149,232,191,.06);cursor:default}
    .grid-cell.revealed{opacity:.65;cursor:default}
    .grid-cell .cell-plus{font-size:1.6rem;color:#5b7480}
    .grid-cell .cell-name{font-size:.82rem;font-weight:800}
    .grid-cell .cell-example{font-size:.68rem;color:var(--muted);margin-top:4px}
    .grid-entry{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#081015}
    .grid-entry h3{margin:0 0 6px}.grid-entry p{color:var(--muted);font-size:.82rem;line-height:1.45}
    .suggestions{display:grid;gap:6px;margin-top:8px;max-height:290px;overflow:auto}
    .suggestion{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0b1218;cursor:pointer;text-align:left}
    .suggestion:hover{border-color:#4c7182}.suggestion small{display:block;color:var(--muted);margin-top:3px}
    .grid-results{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#0a1116}

    .loginstatus{color:var(--muted);font-size:.7rem}
    .syncok{color:var(--ok)}.syncbad{color:var(--bad)}
    .difficultygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
    .difficulty{min-height:44px;padding:16px;border:1px solid var(--line);border-radius:10px;background:#091015;cursor:pointer;text-align:left}
    .difficulty:hover{border-color:#4c7182}.difficulty.selected{border-color:var(--accent);background:#6fd8ff10}
    .difficulty strong{display:block;font-size:1.05rem}.difficulty span{display:block;color:var(--accent);font-size:.72rem;margin-top:3px}
    .difficulty p{color:var(--muted);font-size:.84rem;line-height:1.45;margin:8px 0 0}
    .notice{padding:12px 14px;border-left:2px solid var(--accent);background:#6fd8ff0a;color:#bcd0d8;line-height:1.5}

    footer{padding:18px;color:#6f858e;text-align:center;border-top:1px solid #11202a;font-size:.7rem}
    @media(max-width:820px){.hero,.casegrid,.gamegrid{grid-template-columns:1fr}.pill{display:none}}
    @media(max-width:560px){.choices,.form,.search,.difficultygrid{grid-template-columns:1fr}.brand small{display:none}.top{align-items:flex-start}.topright{flex-direction:column;align-items:flex-end}}
  </style>
</head>

  projectId: "marvel-arcade",

  messagingSenderId: "493712703852",
  appId: "1:493712703852:web:91a458b37440c4fa46f349"
};

const firebaseEnabled = !Object.values(firebaseConfig).some(v => String(v).startsWith("PASTE_"));
let auth=null, db=null, currentUser=null;
let GoogleAuthProviderClass=null, signInWithPopupFn=null, signInWithRedirectFn=null, signOutFn=null;
let docFn=null, getDocFn=null, setDocFn=null, serverTimestampFn=null;

function setLoginStatus(message,bad=false){
  const el=document.getElementById("loginStatus");
  if(!el)return;
  el.textContent=message;
  el.className="loginstatus "+(bad?"syncbad":message.includes("Cloud")?"syncok":"");
}

async function initFirebase(){
  if(!firebaseEnabled)return;
  try{
    const appMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
    const authMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js");
    const fsMod=await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js");

    const app=appMod.initializeApp(firebaseConfig);
    auth=authMod.getAuth(app);
    db=fsMod.getFirestore(app);
    GoogleAuthProviderClass=authMod.GoogleAuthProvider;
    signInWithPopupFn=authMod.signInWithPopup;
    signInWithRedirectFn=authMod.signInWithRedirect;
    signOutFn=authMod.signOut;
    docFn=fsMod.doc;
    getDocFn=fsMod.getDoc;
    setDocFn=fsMod.setDoc;
    serverTimestampFn=fsMod.serverTimestamp;

    await authMod.setPersistence(auth,authMod.browserLocalPersistence);

    authMod.onAuthStateChanged(auth,async user=>{
      currentUser=user;
      updateLoginUI();

      if(!user){
        setLoginStatus("Local save");
        if(activeScreen==="home")home();
        return;
      }

      setLoginStatus("Syncing…");
      try{
        const snap=await getDocFn(docFn(db,"users",user.uid));
        if(snap.exists()&&snap.data().progress){
          prog=mergeProgress(prog,snap.data().progress);
        }
        await save();
        if(activeScreen==="home")home();
      }catch(error){
        console.error(error);
        setLoginStatus("Cloud sync failed",true);
      }
    });
  }catch(error){
    console.error(error);
    setLoginStatus("Firebase failed to load",true);
  }
}

const rarityOrder=["Common","Uncommon","Rare","Epic","Legendary","Mythic"];

function rarityForArtifact(name){

function rarityWeightsForLevel(level){
  if(level<10){
    return {Common:82,Uncommon:18,Rare:0,Epic:0,Legendary:0,Mythic:0};
  }
  if(level<25){
    return {Common:62,Uncommon:30,Rare:8,Epic:0,Legendary:0,Mythic:0};
  }
  if(level<50){
    return {Common:45,Uncommon:34,Rare:16,Epic:5,Legendary:0,Mythic:0};
  }
  if(level<100){
    return {Common:34,Uncommon:31,Rare:22,Epic:10,Legendary:3,Mythic:0};
  }
  if(level<250){
    return {Common:24,Uncommon:28,Rare:26,Epic:16,Legendary:5,Mythic:1};
  }
  if(level<500){
    return {Common:18,Uncommon:24,Rare:28,Epic:20,Legendary:8,Mythic:2};
  }
  return {Common:14,Uncommon:20,Rare:28,Epic:23,Legendary:11,Mythic:4};
}

function chooseRarityForLevel(level,salt=0){
  const weights=rarityWeightsForLevel(level);
  const roll=seededUnit(prog.rewardSeed,level,salt)*100;
  let running=0;

  for(const rarity of rarityOrder){
    running+=weights[rarity]||0;
    if(roll<running)return rarity;
  }

  return "Common";
}

function totalXpForLevel(level){
  if(level<=1)return 0;
  return Math.round(100*Math.pow(level-1,2.15));
}

function lvl(xp){
  xp=Math.max(0,Number(xp)||0);

  // Estimate the level, then correct for rounding.
  let level=Math.max(1,Math.floor(Math.pow(xp/100,1/2.15))+1);

  while(totalXpForLevel(level+1)<=xp)level++;
  while(level>1&&totalXpForLevel(level)>xp)level--;

  return level;
}

function levelProgress(xp){
  const level=lvl(xp);
  const start=totalXpForLevel(level);
  const next=totalXpForLevel(level+1);
  const gained=Math.max(0,xp-start);
  const needed=Math.max(1,next-start);

  return {
    level,
    gained,
    needed,
    next,
    percent:Math.max(0,Math.min(100,(gained/needed)*100))
  };
}


function mergeInventory(localInventory=[],cloudInventory=[]){
  const byName=new Map();
  for(const item of [...cloudInventory,...localInventory]){
    if(!item||!item.name)continue;
    const existing=byName.get(item.name);
    if(!existing){
      byName.set(item.name,{...item,qty:Math.max(1,item.qty||1)});
    }else{
      existing.qty=Math.max(existing.qty||1,item.qty||1);
      existing.firstLevel=Math.min(existing.firstLevel||999999,item.firstLevel||999999);
      existing.lastLevel=Math.max(existing.lastLevel||0,item.lastLevel||0);
    }
  }
  return [...byName.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

function seededUnit(seed,level,salt=0){
  let x=(Number(seed)||1) ^ Math.imul(level+31,2654435761) ^ Math.imul(salt+17,1597334677);
  x=Math.imul(x^(x>>>16),2246822507);
  x=Math.imul(x^(x>>>13),3266489909);
  x=(x^(x>>>16))>>>0;
  return x/4294967296;
}

function rewardLevelEligible(level){
  // Guaranteed at least every 5 levels; other levels have a seeded 28% chance.
  return level%5===0 || seededUnit(prog.rewardSeed,level,1)<0.28;
}

function addInventoryReward(artifact,level){
  const rarity=rarityForArtifact(artifact.name);
  const existing=(prog.inventory||[]).find(item=>item.name===artifact.name);
  if(existing){
    existing.qty=(existing.qty||1)+1;
    existing.lastLevel=level;
    existing.rarity=rarity;
  }else{
    prog.inventory.push({
      name:artifact.name,
      rarity,
      qty:1,
      firstLevel:level,
      lastLevel:level
    });
  }
  prog.unseenInventory=(prog.unseenInventory||0)+1;
}

function rewardArtifactFor(level,slot){
  const desiredRarity=chooseRarityForLevel(level,slot+100);
  const owned=new Set((prog.inventory||[]).map(item=>item.name));

  let pool=artifacts.filter(item=>
    rarityForArtifact(item.name)===desiredRarity &&
    !owned.has(item.name)
  );

  // If all unowned artefacts of that rarity are gone, allow duplicates.
  if(!pool.length){
    pool=artifacts.filter(item=>rarityForArtifact(item.name)===desiredRarity);
  }

  // If a tier has no artefacts at all, step downward to the nearest available tier.
  if(!pool.length){
    let rarityIndex=rarityOrder.indexOf(desiredRarity);
    while(rarityIndex>0&&!pool.length){
      rarityIndex--;
      const fallbackRarity=rarityOrder[rarityIndex];
      pool=artifacts.filter(item=>rarityForArtifact(item.name)===fallbackRarity);
    }
  }

  if(!pool.length)pool=artifacts;

  const index=Math.floor(seededUnit(prog.rewardSeed,level,slot+200)*pool.length);
  return pool[Math.max(0,Math.min(pool.length-1,index))];
}

function processLevelRewards(){
  const currentLevel=lvl(prog.xp);
  const processed=new Set(prog.rewardedLevels||[]);

  for(let level=2;level<=currentLevel;level++){
    if(processed.has(level))continue;

    if(rewardLevelEligible(level)){
      let count=1;
      if(level%25===0)count=3;
      else if(level%10===0)count=2;

      for(let slot=0;slot<count;slot++){
        addInventoryReward(rewardArtifactFor(level,slot),level);
      }
    }

    prog.rewardedLevels.push(level);
    processed.add(level);
  }

  prog.rewardedLevels=[...new Set(prog.rewardedLevels)].sort((a,b)=>a-b);
}

function buildClues(c,key){
 const all={
   species:`CLASSIFICATION: Species — ${c.species}`,
   affiliation:`AFFILIATION: Records connect the subject to ${rnd(c.aff)}.`,
   associate:`KNOWN ASSOCIATE: ${rnd(c.assoc)}.`,
   power:`CAPABILITY: ${rnd(c.powers)}.`,
   location:`LOCATION OF INTEREST: ${rnd(c.loc)}.`,
   year:`FIRST MCU APPEARANCE YEAR: ${c.year}.`,
   equipment:`EQUIPMENT PROFILE: The subject is associated with ${c.safeGear}.`,
   quote:c.quote?`ARCHIVED DIALOGUE: “${c.quote}”`:null
 };

 let keys=
   key==="recruit" ? ["species","affiliation","power","equipment"] :
   key==="agent" ? ["year","associate","location","power"] :
   key==="expert" ? ["quote","location","associate","equipment"] :
                    ["quote","location","year","associate"];

 let first=keys.map(k=>all[k]).filter(Boolean);
 const fallback=sh(Object.values(all).filter(Boolean));

 for(const clue of fallback){
   if(first.length>=4)break;
   if(!first.includes(clue))first.push(clue);
 }

 first=sh(first.slice(0,4));
 return [...first,`FINAL LIFELINE: ${c.finalEasy}`];
}

function guessGame(){
 activeScreen="guess";
 prog.games++;
 save();

 const c=fresh();
 const d=difficulties[prog.difficulty];
 const clues=buildClues(c,prog.difficulty);
 let n=1,done=false;

 function pts(){
   if(n>=clues.length)return 0;
   return d.points[Math.min(n-1,d.points.length-1)];
 }

 function render(msg=""){
   screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">IDENTITY ANALYSIS · ${d.name.toUpperCase()}</p><h1>Unknown subject</h1></div><div class="reward">STREAK ${prog.streak}</div></div>
   <section class="mission"><div class="reward">${n>=clues.length?"FINAL LIFELINE · 0 XP":`${pts()} points · ${d.multiplier}× XP`}</div>
   <div class="clues">${clues.map((x,i)=>`<div class="clue ${i<n?"":"hidden"}"><span>${i===4?"FINAL CLUE":`CLUE ${i+1}`}</span><div>${i<n?esc(x):"████████████████"}</div></div>`).join("")}</div>
   <form class="form" id="gf"><input id="gi" placeholder="Character name or alias" autocomplete="off" ${done?"disabled":""} required><button class="btn primary" ${done?"disabled":""}>Submit</button></form>
   <div class="row"><button class="btn" id="more" ${n>=5||done?"disabled":""}>Reveal another clue</button>${done?'<button class="btn primary" id="next">Next subject</button><button class="btn" id="change">Change difficulty</button>':""}</div>
   <p class="feedback" id="fb">${esc(msg)}</p></section>`;

   document.getElementById("b").onclick=home;
   document.getElementById("more").onclick=()=>{n=Math.min(5,n+1);render()};

   if(done){
     document.getElementById("next").onclick=guessGame;
     document.getElementById("change").onclick=difficultyMenu;
   }

   document.getElementById("gf").onsubmit=async e=>{
     e.preventDefault();
     if(done)return;

     const a=document.getElementById("gi").value;
     const ok=[c.name,...c.aliases].some(x=>norm(x)===norm(a));

     if(ok){
       done=true;
       const gain=n>=clues.length ? 0 : Math.round(pts()*8*d.multiplier);
       prog.xp+=gain;
       prog.guessed++;
       prog.streak++;
       prog.best=Math.max(prog.best,prog.streak);
       prog.recent=[...prog.recent,c.name].slice(-14);
       await save();
       render(
         gain>0
           ? `IDENTITY CONFIRMED: ${c.name} · +${gain} XP`
           : `IDENTITY CONFIRMED: ${c.name} · final lifeline used, so +0 XP`
       );
     }else{
       prog.streak=0;
       await save();
       if(n>=5){
         done=true;
         render(`SUBJECT REVEALED: ${c.name}`);
       }else{
         document.getElementById("fb").textContent="IDENTITY REJECTED. Guess again or reveal another clue.";
       }
     }
   };
 }
 render();
}

function quoteId(item){
 return norm(`${item.speaker}-${item.quote}`);
}

function quoteAccepted(item,answer){
 const accepted=[item.speaker,...(quoteAliases[item.speaker]||[])];
 return accepted.some(name=>norm(name)===norm(answer));
}

function freshQuote(pool){
 const recentIds=new Set(prog.recentQuoteIds||[]);
 const recentItems=(prog.recentQuoteIds||[])
   .slice(-5)
   .map(id=>quoteBank.find(q=>quoteId(q)===id))
   .filter(Boolean);
 const recentSpeakers=new Set(recentItems.map(q=>q.speaker));

 let fresh=pool.filter(q=>!recentIds.has(quoteId(q))&&!recentSpeakers.has(q.speaker));
 if(!fresh.length)fresh=pool.filter(q=>!recentIds.has(quoteId(q)));
 if(!fresh.length)fresh=pool;

 return rnd(fresh);
}

function rememberQuote(item){
 prog.recentQuoteIds=[...(prog.recentQuoteIds||[]),quoteId(item)].slice(-24);
}

function quoteDistractors(item,mode){
 const allSpeakers=[...new Set(quoteBank.map(q=>q.speaker))].filter(name=>name!==item.speaker);
 const speakerGroups=quoteGroups[item.speaker]||[];
 let ordered=[];

 if(mode==="expert"||mode==="agent"){
   ordered.push(...sh(allSpeakers.filter(name=>{
     const groups=quoteGroups[name]||[];
     return groups.some(group=>speakerGroups.includes(group));
   })));
 }

 ordered.push(...sh(allSpeakers));

 const unique=[];
 for(const name of ordered){
   if(!unique.includes(name))unique.push(name);
   if(unique.length>=3)break;
 }
 return unique;
}

function quoteGame(mode="agent"){
 activeScreen="quote";
 prog.games++;
 save();

 const cfg={
   recruit:{mult:1,tiers:["recruit","agent"],typedChance:.20},
   agent:{mult:1.5,tiers:["recruit","agent","expert"],typedChance:.48},
   expert:{mult:2,tiers:["agent","expert"],typedChance:.68}
 }[mode]||{mult:1.5,tiers:["recruit","agent","expert"],typedChance:.48};

 const pool=quoteBank.filter(q=>cfg.tiers.includes(q.tier));
 const item=freshQuote(pool.length?pool:quoteBank);
 const initialTyped=Math.random()<cfg.typedChance;
 const distractors=quoteDistractors(item,mode);
 const choices=sh([item.speaker,...distractors]);
 let answerType=initialTyped?"typed":"mcq";
 let converted=false;
 let answered=false;

 function reward(){
   if(answerType==="typed"&&!converted)return Math.round(85*cfg.mult);
   return Math.round(55*cfg.mult);
 }

 function render(msg=""){
   const answerUi=answerType==="typed"
     ? `<form class="form" id="quoteTypedForm">
          <input id="quoteTypedInput" placeholder="Type the character name or alias" autocomplete="off" ${answered?"disabled":""} required>
          <button class="btn primary" ${answered?"disabled":""}>Submit</button>
        </form>
        <div class="row">
          <button class="btn" id="convertQuote" ${answered?"disabled":""}>Show MCQ instead · lower XP</button>
        </div>`
     : `<div class="choices">${choices.map(name=>`<button class="choice" data-quote-answer="${esc(name)}" ${answered?"disabled":""}>${esc(name)}</button>`).join("")}</div>`;

   screen.innerHTML=`<div class="missionhead">
   <button class="back" id="qback">← Terminal</button>
   <div><p class="eyebrow">WHO SAID IT? · ${mode.toUpperCase()} · ${answerType==="typed"?"TYPE-IN":"MCQ"}</p><h1>Identify the speaker</h1></div>
   <div class="reward">STREAK ${prog.quoteStreak||0} · +${reward()} XP</div>
   </div>
   <section class="mission">
   <div class="quote-box"><blockquote>“${esc(item.quote)}”</blockquote><small>ARCHIVED MCU DIALOGUE</small></div>
   ${answerUi}
   <div class="row">${answered?'<button class="btn primary" id="qn">Next quote</button><button class="btn" id="qc">Change difficulty</button>':""}</div>
   <p class="feedback" id="qfeedback">${esc(msg)}</p></section>`;

   document.getElementById("qback").onclick=home;

   async function finish(correct){
     if(answered)return;
     answered=true;
     rememberQuote(item);

     if(correct){
       const gain=reward();
       prog.xp+=gain;
       prog.quotesIdentified=(prog.quotesIdentified||0)+1;
       prog.quoteStreak=(prog.quoteStreak||0)+1;
       prog.bestQuoteStreak=Math.max(prog.bestQuoteStreak||0,prog.quoteStreak);
       await save();
       render(`CORRECT: ${item.speaker} · +${gain} XP`);
     }else{
       prog.quoteStreak=0;
       await save();
       render(`INCORRECT · ${item.speaker} said it.`);
     }
   }

   if(answerType==="typed"){
     document.getElementById("quoteTypedForm").onsubmit=e=>{
       e.preventDefault();
       finish(quoteAccepted(item,document.getElementById("quoteTypedInput").value));
     };

     document.getElementById("convertQuote").onclick=()=>{
       answerType="mcq";
       converted=true;
       render("MCQ assistance enabled. Reward reduced.");
     };
   }else{
     document.querySelectorAll("[data-quote-answer]").forEach(button=>{
       button.onclick=()=>finish(button.dataset.quoteAnswer===item.speaker);
     });
   }

   if(answered){
     document.getElementById("qn").onclick=()=>quoteGame(mode);
     document.getElementById("qc").onclick=quoteDifficultyMenu;
   }
 }
 render();
}

function gridCandidates(rowTag,colTag){
 return gridProfiles.filter(profile=>profile.tags.includes(rowTag)&&profile.tags.includes(colTag));
}

function gridHasDistinctSolution(rows,cols){
 const cells=[];
 for(let r=0;r<3;r++){
   for(let c=0;c<3;c++){
     const candidates=gridCandidates(rows[r],cols[c]);
     if(!candidates.length)return false;
     cells.push({r,c,candidates});
   }
 }

 cells.sort((a,b)=>a.candidates.length-b.candidates.length);
 const used=new Set();

 function backtrack(index){
   if(index>=cells.length)return true;
   for(const candidate of cells[index].candidates){
     if(used.has(candidate.name))continue;
     used.add(candidate.name);
     if(backtrack(index+1))return true;
     used.delete(candidate.name);
   }
   return false;
 }

 return backtrack(0);
}

function generateMarvelGrid(){
 for(let attempt=0;attempt<800;attempt++){
   const rows=sh(gridRowPool).slice(0,3);
   const cols=sh(gridColPool).slice(0,3);

   let reasonable=true;
   for(const row of rows){
     for(const col of cols){
       const count=gridCandidates(row,col).length;
       if(count<1||count>14){reasonable=false;break;}
     }
     if(!reasonable)break;
   }

   if(reasonable&&gridHasDistinctSolution(rows,cols))return {rows,cols};
 }

 const fallback={rows:["avenger","guardian","villain"],cols:["phase3","tech","space"]};
 return fallback;
}

function findGridProfile(answer){
 const needle=norm(answer);
 return gridProfiles.find(profile=>
   norm(profile.name)===needle ||
   (profile.aliases||[]).some(alias=>norm(alias)===needle)
 );
}

function marvelGridGame(){
 activeScreen="grid";
 prog.games++;
 prog.gridPlayed=(prog.gridPlayed||0)+1;
 save();

 const puzzle=generateMarvelGrid();
 let attempts=9;
 let points=0;
 let selectedCell=null;
 let finished=false;
 let gaveUp=false;
 const filled={};
 const usedNames=new Set();

 function cellKey(r,c){return `${r}-${c}`}

 function scoreXp(){
   return Number(((points/9)*10).toFixed(1));
 }

 function validExample(r,c){
   const used=new Set(Object.values(filled));
   return gridCandidates(puzzle.rows[r],puzzle.cols[c]).find(p=>!used.has(p.name)) ||
          gridCandidates(puzzle.rows[r],puzzle.cols[c])[0];
 }

 async function finishPuzzle(giveUp=false){
   if(finished)return;
   finished=true;
   gaveUp=giveUp;

   const xp=giveUp?0:scoreXp();
   if(!giveUp){
     prog.xp+=xp;
     prog.gridPoints=(prog.gridPoints||0)+points;
     if(points===9)prog.gridPerfect=(prog.gridPerfect||0)+1;
   }
   await save();
   render();
 }

 function render(message=""){
   const headerCells=puzzle.cols.map(col=>`<div class="grid-head">${esc(gridCategoryMap[col])}</div>`).join("");
   let body="";

   for(let r=0;r<3;r++){
     body+=`<div class="grid-rowhead">${esc(gridCategoryMap[puzzle.rows[r]])}</div>`;
     for(let c=0;c<3;c++){
       const key=cellKey(r,c);
       const answer=filled[key];
       const selected=selectedCell&&selectedCell.r===r&&selectedCell.c===c;
       const reveal=finished&&!answer;
       const example=reveal?validExample(r,c):null;

       body+=`<button class="grid-cell ${answer?"filled":""} ${selected?"selected":""} ${reveal?"revealed":""}"
                     data-grid-cell="${r},${c}"
                     ${answer||finished?"disabled":""}
                     type="button">
         ${answer
           ? `<span class="cell-name">${esc(answer)}</span>`
           : reveal
             ? `<span><span class="cell-name">Unfilled</span><span class="cell-example">e.g. ${esc(example?.name||"No example")}</span></span>`
             : `<span class="cell-plus">+</span>`}
       </button>`;
     }
   }

   let entry="";
   if(!finished&&selectedCell){
     const rowLabel=gridCategoryMap[puzzle.rows[selectedCell.r]];
     const colLabel=gridCategoryMap[puzzle.cols[selectedCell.c]];

     entry=`<div class="grid-entry">
       <h3>${esc(rowLabel)} × ${esc(colLabel)}</h3>
       <p>Type a Marvel character who matches both categories. A valid character can only be used once on the board.</p>
       <form class="form" id="gridAnswerForm">
         <input id="gridAnswerInput" placeholder="Search character…" autocomplete="off" required>
         <button class="btn primary">Submit</button>
       </form>
       <div class="suggestions" id="gridSuggestions"></div>
     </div>`;
   }

   const result=finished
     ? `<div class="grid-results">
         <strong>${gaveUp?"PUZZLE GIVEN UP":points===9?"PERFECT GRID":"GRID COMPLETE"}</strong>
         <p>${points}/9 points · ${gaveUp?"0":scoreXp()} XP earned</p>
         <div class="row"><button class="btn primary" id="newGrid">New puzzle</button><button class="btn" id="gridHome">Terminal</button></div>
       </div>`
     : "";

   screen.innerHTML=`<div class="missionhead">
     <button class="back" id="gridBack">← Terminal</button>
     <div><p class="eyebrow">MARVEL GRID</p><h1>3×3 personnel matrix</h1></div>
   </div>

   <section class="mission" style="max-width:1000px">
     <div class="notice">
       Fill each cell with a character matching both its row and column. You get exactly 9 attempts.
       Characters cannot be reused.
     </div>

     <div class="grid-status">
       <span class="grid-chip"><strong>${points}/9</strong> points</span>
       <span class="grid-chip"><strong>${attempts}</strong> attempts left</span>
       <span class="grid-chip">Current XP if finished: <strong>${scoreXp()}</strong></span>
     </div>

     <div class="marvel-grid-wrap">
       <div class="marvel-grid">
         <div class="grid-corner">ROW × COLUMN</div>
         ${headerCells}
         ${body}
       </div>
     </div>

     ${entry}

     ${!finished?`<div class="row">
       <button class="btn" id="giveUpGrid">Give up · 0 XP</button>
       <button class="btn" id="newGridEarly">New puzzle · forfeits current puzzle</button>
     </div>`:""}

     <p class="feedback" id="gridFeedback">${esc(message)}</p>
     ${result}
   </section>`;

   document.getElementById("gridBack").onclick=home;

   document.querySelectorAll("[data-grid-cell]").forEach(button=>{
     button.onclick=()=>{
       const [r,c]=button.dataset.gridCell.split(",").map(Number);
       selectedCell={r,c};
       render();
       const input=document.getElementById("gridAnswerInput");
       if(input)input.focus();
     };
   });

   if(!finished&&selectedCell){
     const input=document.getElementById("gridAnswerInput");
     const suggestions=document.getElementById("gridSuggestions");

     function refreshSuggestions(){
       const query=norm(input.value);
       if(!query){suggestions.innerHTML="";return;}

       const matches=gridProfiles
         .filter(profile=>!usedNames.has(profile.name))
         .filter(profile=>
           norm(profile.name).includes(query) ||
           (profile.aliases||[]).some(alias=>norm(alias).includes(query))
         )
         .slice(0,10);

       suggestions.innerHTML=matches.map(profile=>`<button class="suggestion" data-grid-suggestion="${esc(profile.name)}" type="button">
         <strong>${esc(profile.name)}</strong>
         <small>${esc((profile.aliases||[]).slice(0,2).join(" · "))}</small>
       </button>`).join("");

       document.querySelectorAll("[data-grid-suggestion]").forEach(button=>{
         button.onclick=()=>{
           input.value=button.dataset.gridSuggestion;
           suggestions.innerHTML="";
         };
       });
     }

     input.addEventListener("input",refreshSuggestions);

     document.getElementById("gridAnswerForm").onsubmit=async event=>{
       event.preventDefault();
       if(finished||attempts<=0)return;

       const profile=findGridProfile(input.value);
       if(!profile){
         document.getElementById("gridFeedback").textContent="That character is not in the Marvel Grid database. Choose a suggested character.";
         return;
       }

       if(usedNames.has(profile.name)){
         document.getElementById("gridFeedback").textContent=`${profile.name} has already been used on this grid.`;
         return;
       }

       attempts--;
       const rowTag=puzzle.rows[selectedCell.r];
       const colTag=puzzle.cols[selectedCell.c];

       if(profile.tags.includes(rowTag)&&profile.tags.includes(colTag)){
         const key=cellKey(selectedCell.r,selectedCell.c);
         filled[key]=profile.name;
         usedNames.add(profile.name);
         points++;
         selectedCell=null;

         if(points===9||attempts===0){
           await finishPuzzle(false);
         }else{
           render(`CORRECT: ${profile.name}`);
         }
       }else{
         const failedName=profile.name;
         if(attempts===0){
           await finishPuzzle(false);
         }else{
           render(`INCORRECT: ${failedName} does not satisfy both categories. Attempt used.`);
         }
       }
     };
   }

   const giveUp=document.getElementById("giveUpGrid");
   if(giveUp)giveUp.onclick=()=>finishPuzzle(true);

   const newEarly=document.getElementById("newGridEarly");
   if(newEarly)newEarly.onclick=()=>marvelGridGame();

   const newGrid=document.getElementById("newGrid");
   if(newGrid)newGrid.onclick=marvelGridGame;

   const gridHome=document.getElementById("gridHome");
   if(gridHome)gridHome.onclick=home;
 }

 render();
}

 ]).slice(0,4);let q="",sel="";
 function filtered(){if(!q)return characters;let n=norm(q);return characters.filter(c=>norm([c.name,...c.aliases,...c.aff,...c.powers,...c.gear,...c.assoc,...c.loc,c.species,c.year].join(" ")).includes(n))}
 function render(msg=""){let rs=filtered();screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">CLASSIFIED DATABASE</p><h1>Active case</h1></div></div><section class="casegrid"><aside class="case"><p class="eyebrow">ACTIVE INVESTIGATION</p><h2>Identify the unknown subject.</h2><p>Use the evidence and search the personnel database.</p><div class="evidence">${cl.map((x,i)=>`<div><span>EVIDENCE ${i+1}</span><p>${esc(x)}</p></div>`).join("")}</div></aside><section class="db"><form class="search" id="sf"><input id="si" placeholder="Search name, alias, power, team, location…" value="${esc(q)}"><button class="btn">Search</button></form><div class="results">${rs.map(c=>`<button class="person ${sel===c.name?"sel":""}" data-p="${esc(c.name)}"><strong>${esc(c.name)}</strong><small>${esc(c.aliases[0]||"")}</small><p>${esc(c.species)} · ${esc(c.aff.join(", "))}<br>${esc(c.powers.slice(0,2).join(", "))}</p></button>`).join("")}</div><div class="row"><button class="btn primary" id="acc" ${sel?"":"disabled"}>Submit selected identity</button></div><p class="feedback" id="fb">${esc(msg)}</p></section></section>`;
 document.getElementById("b").onclick=home;document.getElementById("sf").onsubmit=e=>{e.preventDefault();q=document.getElementById("si").value;render()};document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{sel=b.dataset.p;render()});document.getElementById("acc").onclick=()=>{if(sel===s.name){prog.xp+=80;prog.cases++;prog.recent=[...prog.recent,s.name].slice(-12);save();screen.innerHTML=`<section class="mission"><p class="eyebrow">CASE CLOSED</p><h1>${esc(s.name)} identified.</h1><div class="reward">+80 XP</div><div class="row"><button class="btn primary" id="new">Generate new case</button><button class="btn" id="home">Terminal</button></div></section>`;document.getElementById("new").onclick=dbGame;document.getElementById("home").onclick=home}else document.getElementById("fb").textContent="IDENTITY REJECTED. Re-check the evidence."}}
 render();
}
