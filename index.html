<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>S.H.I.E.L.D. Marvel Arcade</title>
  <style>
    :root{
      --bg:#05070a;--panel:#0d1319;--panel2:#111b24;--line:#263742;
      --text:#edf5f7;--muted:#91a4ad;--accent:#6fd8ff;--ok:#95e8bf;--bad:#ff9d9d
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 20% 0,#10202a 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}
    button{color:inherit}
    .top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:#05070ae8;backdrop-filter:blur(12px)}
    .brand{display:flex;gap:10px;align-items:center;background:none;border:0;cursor:pointer;text-align:left}
    .mark{display:grid;place-items:center;width:38px;height:42px;border:1px solid var(--accent);border-radius:10px 10px 18px 18px;color:var(--accent);font-weight:900}
    .brand strong{display:block;letter-spacing:.14em}.brand small{display:block;color:var(--muted);font-size:.64rem;letter-spacing:.14em;margin-top:2px}
    .stats{display:flex;gap:8px;align-items:center}
    .pill{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#0b1116}.pill span{display:block;color:var(--muted);font-size:.58rem;letter-spacing:.12em}.pill strong{font-size:.9rem}
    main{width:min(1120px,calc(100% - 24px));margin:0 auto;padding:38px 0 48px}
    .hero{display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:end}
    .eyebrow{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.18em;margin:0 0 8px}
    h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:0 0 12px;letter-spacing:-.035em}
    h2{line-height:1.2}.lede{color:var(--muted);line-height:1.65;max-width:700px}
    .card,.mission,.case,.db{border:1px solid var(--line);background:linear-gradient(145deg,#101820,#080d11);border-radius:18px}
    .card{padding:18px}.progress{height:7px;background:#1d2830;border-radius:999px;overflow:hidden;margin:14px 0 8px}.progress span{display:block;height:100%;background:var(--accent)}
    .gamegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
    .game{min-height:230px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#0b1116;cursor:pointer;text-align:left;position:relative}
    .game:hover{border-color:#47697a;background:#0f171e}.game strong{display:block;margin-top:36px;font-size:1.28rem}.game p{color:var(--muted);line-height:1.55}.num{color:#607985;font-size:.7rem;letter-spacing:.14em}.meta{position:absolute;left:20px;right:20px;bottom:18px;border-top:1px solid var(--line);padding-top:12px;color:#b5c5cc;font-size:.8rem}
    .mission{max-width:820px;margin:0 auto;padding:24px}.missionhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}
    .back,.btn,.choice{min-height:44px;border-radius:10px;cursor:pointer}
    .back{border:0;background:none;color:var(--muted);padding:8px}
    .btn{padding:10px 15px;border:1px solid var(--line);background:#101820;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#051018}.btn:disabled{opacity:.45;cursor:not-allowed}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.choice{padding:14px;border:1px solid var(--line);background:#091015;text-align:left}.choice:hover{border-color:#4c7182}
    .feedback{min-height:24px;color:#b1c1c8;margin-top:16px}.form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}.form input,.search input{min-height:46px;border-radius:10px;border:1px solid var(--line);background:#05090c;color:var(--text);padding:10px 12px;font-size:16px;width:100%}
    .clues{display:grid;gap:8px;margin:16px 0}.clue{border:1px solid var(--line);border-radius:12px;padding:13px}.clue span{display:block;color:var(--muted);font-size:.64rem;letter-spacing:.14em;margin-bottom:6px}.hidden{opacity:.35}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.reward{display:inline-block;padding:8px 12px;border:1px solid #355364;border-radius:10px;color:var(--accent);font-weight:800;margin:8px 0}
    .casegrid{display:grid;grid-template-columns:.7fr 1.3fr;gap:14px}.case,.db{padding:20px}.case p{color:var(--muted);line-height:1.55}.evidence{display:grid;gap:8px;margin-top:18px}.evidence div{border-left:2px solid var(--accent);background:#6fd8ff0a;padding:10px}.evidence span{font-size:.62rem;color:var(--muted);letter-spacing:.12em}
    .search{display:grid;grid-template-columns:1fr auto;gap:8px}.results{display:grid;gap:8px;max-height:560px;overflow:auto;margin-top:12px}.person{border:1px solid var(--line);border-radius:12px;background:#091015;padding:13px;text-align:left;cursor:pointer}.person.sel{border-color:var(--accent);background:#6fd8ff10}.person strong{display:block}.person small{color:var(--accent)}.person p{font-size:.78rem;color:#c5d1d6;margin:7px 0 0;line-height:1.4}
    footer{padding:18px;color:#6f858e;text-align:center;border-top:1px solid #11202a;font-size:.7rem}
    @media(max-width:820px){.hero,.casegrid,.gamegrid{grid-template-columns:1fr}.pill{display:none}}
    @media(max-width:560px){.choices,.form,.search{grid-template-columns:1fr}.brand small{display:none}}
  </style>
</head>
<body>
  <header class="top">
    <button class="brand" id="homeBtn">
      <span class="mark">S</span>
      <span><strong>S.H.I.E.L.D.</strong><small>TRAINING NETWORK</small></span>
    </button>
    <div class="stats">
      <div class="pill"><span>LEVEL</span><strong id="lvl">1</strong></div>
      <div class="pill"><span>XP</span><strong id="xp">0</strong></div>
    </div>
  </header>

  <main id="screen"></main>
  <footer>Unofficial fan-made project · progress saves on this device</footer>

<script>
const characters=[
{name:"Steve Rogers",aliases:["Captain America","Cap"],species:"Human",aff:["Avengers","S.H.I.E.L.D."],powers:["Super-soldier physiology","Enhanced strength","Enhanced endurance"],gear:["Vibranium shield"],assoc:["Bucky Barnes","Sam Wilson","Natasha Romanoff"],loc:["Brooklyn","Washington, D.C.","Avengers Compound"],year:2011,quote:"I can do this all day."},
{name:"Tony Stark",aliases:["Iron Man"],species:"Human",aff:["Avengers","Stark Industries"],powers:["Engineering genius","Powered armour"],gear:["Iron Man armour","Arc reactor technology"],assoc:["Pepper Potts","James Rhodes","Peter Parker"],loc:["Malibu","New York","Avengers Compound"],year:2008,quote:"We have a Hulk."},
{name:"Natasha Romanoff",aliases:["Black Widow"],species:"Human",aff:["Avengers","S.H.I.E.L.D.","Red Room"],powers:["Elite espionage","Martial arts","Marksmanship"],gear:["Widow's Bite"],assoc:["Clint Barton","Steve Rogers","Yelena Belova"],loc:["Budapest","New York"],year:2010,quote:"I've got red in my ledger."},
{name:"Thor",aliases:["God of Thunder"],species:"Asgardian",aff:["Avengers","Asgard"],powers:["Lightning","Superhuman strength","Longevity"],gear:["Mjolnir","Stormbreaker"],assoc:["Loki","Valkyrie","Bruce Banner"],loc:["Asgard","New Asgard","Earth"],year:2011,quote:"I need a horse!"},
{name:"Bruce Banner",aliases:["Hulk","Smart Hulk"],species:"Human",aff:["Avengers"],powers:["Gamma transformation","Extreme strength","Scientific genius"],gear:[],assoc:["Tony Stark","Thor","Natasha Romanoff"],loc:["Harlem","Sakaar","Avengers Compound"],year:2008,quote:"That's my secret, Captain."},
{name:"Clint Barton",aliases:["Hawkeye","Ronin"],species:"Human",aff:["Avengers","S.H.I.E.L.D."],powers:["Master archer","Close combat"],gear:["Trick arrows","Bow"],assoc:["Natasha Romanoff","Kate Bishop","Laura Barton"],loc:["New York","Avengers Compound"],year:2011,quote:"The city is flying."},
{name:"Wanda Maximoff",aliases:["Scarlet Witch"],species:"Human",aff:["Avengers"],powers:["Chaos magic","Telekinesis","Reality manipulation"],gear:["Darkhold"],assoc:["Vision","Pietro Maximoff","Agatha Harkness"],loc:["Sokovia","Westview"],year:2014,quote:"You took everything from me."},
{name:"Vision",aliases:["Vision"],species:"Synthezoid",aff:["Avengers"],powers:["Density control","Flight","Energy projection"],gear:["Mind Stone"],assoc:["Wanda Maximoff","Tony Stark","Bruce Banner"],loc:["Westview","Avengers Compound"],year:2015,quote:"What is grief, if not love persevering?"},
{name:"Peter Parker",aliases:["Spider-Man"],species:"Human",aff:["Avengers"],powers:["Spider-sense","Wall-crawling","Enhanced agility"],gear:["Web-shooters","Spider-Man suit"],assoc:["Tony Stark","MJ","Ned Leeds"],loc:["Queens","New York"],year:2016,quote:"Come on, Spider-Man."},
{name:"T'Challa",aliases:["Black Panther"],species:"Human",aff:["Wakanda","Avengers"],powers:["Enhanced physiology","Martial arts"],gear:["Vibranium suit"],assoc:["Shuri","Okoye","Nakia"],loc:["Wakanda","Busan"],year:2016,quote:"Wakanda forever!"},
{name:"Stephen Strange",aliases:["Doctor Strange"],species:"Human",aff:["Masters of the Mystic Arts"],powers:["Sorcery","Astral projection","Portal creation"],gear:["Cloak of Levitation","Sling Ring"],assoc:["Wong","Christine Palmer","Peter Parker"],loc:["Sanctum Sanctorum","Kamar-Taj","New York"],year:2016,quote:"Dormammu, I've come to bargain."},
{name:"Scott Lang",aliases:["Ant-Man"],species:"Human",aff:["Avengers"],powers:["Size manipulation"],gear:["Ant-Man suit","Pym Particles"],assoc:["Hope van Dyne","Hank Pym","Cassie Lang"],loc:["San Francisco","Quantum Realm"],year:2015,quote:"Does anyone have any orange slices?"},
{name:"Carol Danvers",aliases:["Captain Marvel"],species:"Human/Kree-enhanced",aff:["Avengers"],powers:["Energy projection","Flight","Superhuman strength"],gear:["Advanced suit"],assoc:["Nick Fury","Monica Rambeau","Maria Rambeau"],loc:["Earth","Space"],year:2019,quote:"I have nothing to prove to you."},
{name:"Loki",aliases:["God of Mischief"],species:"Frost Giant",aff:["Asgard","TVA"],powers:["Illusion magic","Shape-shifting","Sorcery"],gear:["Scepter","Daggers"],assoc:["Thor","Mobius","Sylvie"],loc:["Asgard","TVA","New York"],year:2011,quote:"I have been falling for thirty minutes!"},
{name:"Bucky Barnes",aliases:["Winter Soldier","White Wolf"],species:"Human",aff:["Howling Commandos","HYDRA","Avengers"],powers:["Enhanced physiology","Elite combat"],gear:["Vibranium arm"],assoc:["Steve Rogers","Sam Wilson","T'Challa"],loc:["Brooklyn","Wakanda","Bucharest"],year:2011,quote:"Your mom's name was Sarah."},
{name:"Sam Wilson",aliases:["Falcon","Captain America"],species:"Human",aff:["Avengers","U.S. Air Force"],powers:["Aerial combat","Military training"],gear:["EXO-7 Falcon wings","Vibranium shield"],assoc:["Steve Rogers","Bucky Barnes","Joaquin Torres"],loc:["Washington, D.C.","Louisiana"],year:2014,quote:"On your left."},
{name:"Nick Fury",aliases:["Director Fury"],species:"Human",aff:["S.H.I.E.L.D.","S.A.B.E.R."],powers:["Espionage","Strategy"],gear:["Encrypted communications"],assoc:["Maria Hill","Carol Danvers","Natasha Romanoff"],loc:["Washington, D.C.","Space"],year:2008,quote:"There was an idea."},
{name:"Thanos",aliases:["Mad Titan"],species:"Titan",aff:["Black Order"],powers:["Extreme strength","Durability","Strategic intellect"],gear:["Infinity Gauntlet"],assoc:["Ebony Maw","Gamora","Nebula"],loc:["Titan","Sanctuary II","Earth"],year:2012,quote:"You should have gone for the head."},
{name:"Shuri",aliases:["Black Panther"],species:"Human",aff:["Wakanda"],powers:["Scientific genius","Engineering"],gear:["Vibranium gauntlets"],assoc:["T'Challa","Okoye","Riri Williams"],loc:["Wakanda"],year:2018,quote:"Don't scare me like that, colonizer!"},
{name:"Rocket",aliases:["Rocket Raccoon"],species:"Genetically modified raccoon",aff:["Guardians of the Galaxy","Avengers"],powers:["Engineering","Weapons expertise","Tactical skill"],gear:["Custom blasters"],assoc:["Groot","Peter Quill","Nebula"],loc:["Knowhere","Space"],year:2014,quote:"Ain't no thing like me, except me."},
{name:"Groot",aliases:["Groot"],species:"Flora colossus",aff:["Guardians of the Galaxy"],powers:["Regeneration","Plant-body manipulation","Enhanced strength"],gear:[],assoc:["Rocket","Peter Quill","Mantis"],loc:["Knowhere","Space"],year:2014,quote:"I am Groot."}
];

const artifacts=[
{name:"Mjolnir",clue:"An enchanted Asgardian hammer."},
{name:"Vibranium shield",clue:"A circular Wakandan-metal defensive weapon."},
{name:"Infinity Gauntlet",clue:"Designed to channel all six Infinity Stones."},
{name:"Sling Ring",clue:"Used by sorcerers to create portals."},
{name:"Pym Particles",clue:"Technology used to alter scale and access the Quantum Realm."},
{name:"Stormbreaker",clue:"A powerful Uru weapon forged at Nidavellir."},
{name:"Vibranium arm",clue:"A Wakandan replacement prosthetic."},
{name:"Widow's Bite",clue:"Electroshock equipment used by a master spy."}
];

const events=[
["Battle of New York",2012],["Fall of S.H.I.E.L.D.",2014],["Battle of Sokovia",2015],["Avengers Civil War",2016],["Battle of Wakanda",2018],["The Snap",2018],["Avengers time heist",2023],["Battle of Earth",2023]
];

const themes=["Abandoned HYDRA archive","Damaged Helicarrier","Avengers Tower security floor","TVA evidence vault","Wakandan research annex","Sanctum containment chamber","S.H.I.E.L.D. black-site terminal room"];

const def={xp:0,rooms:0,guessed:0,streak:0,best:0,cases:0,games:0,recent:[]};
let prog={...def,...JSON.parse(localStorage.getItem("shield-onefile")||"{}")};
const screen=document.getElementById("screen");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9]/g,"");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function lvl(x){return x>=4000?7:x>=2500?6:x>=1500?5:x>=800?4:x>=350?3:x>=120?2:1}
function save(){localStorage.setItem("shield-onefile",JSON.stringify(prog));document.getElementById("xp").textContent=prog.xp;document.getElementById("lvl").textContent=lvl(prog.xp)}
function fresh(){let a=characters.filter(c=>!prog.recent.includes(c.name));return rnd(a.length?a:characters)}
function home(){
 save();
 screen.innerHTML=`<section class="hero"><div><p class="eyebrow">SECURE CONNECTION ESTABLISHED</p><h1>Welcome, Agent.</h1><p class="lede">Three procedural Marvel training modules. Progress saves automatically on this device.</p></div><div class="card"><span style="color:var(--muted);font-size:.72rem;letter-spacing:.12em">CLEARANCE LEVEL</span><strong style="float:right;color:var(--accent);font-size:2rem">${lvl(prog.xp)}</strong><div class="progress"><span style="width:${Math.min(100,prog.xp/40)}%"></span></div><small style="color:var(--muted)">${prog.xp} XP</small></div></section>
 <section class="gamegrid">
 <button class="game" data-g="e"><span class="num">01</span><strong>Escape Protocol</strong><p>Break out by solving randomly assembled Marvel locks.</p><span class="meta">${prog.rooms} rooms escaped</span></button>
 <button class="game" data-g="g"><span class="num">02</span><strong>Identity Analysis</strong><p>Guess a character from increasingly obvious clues and short niche quotes.</p><span class="meta">Best streak: ${prog.best}</span></button>
 <button class="game" data-g="d"><span class="num">03</span><strong>Classified Database</strong><p>Search personnel records and solve generated S.H.I.E.L.D. cases.</p><span class="meta">${prog.cases} cases solved</span></button>
 </section>`;
 document.querySelector('[data-g="e"]').onclick=escapeGame;
 document.querySelector('[data-g="g"]').onclick=guessGame;
 document.querySelector('[data-g="d"]').onclick=dbGame;
}
function pickOthers(arr,x,n){return sh(arr.filter(v=>v!==x)).slice(0,n)}
function escapeGame(){
 prog.games++;save();
 let theme=rnd(themes),puzzles=[];
 let c=rnd(characters), alias=rnd(c.aliases);
 puzzles.push({q:`IDENTITY LOCK: Which person uses the alias “${alias}”?`,a:c.name,o:sh([c.name,...pickOthers(characters,c,3).map(x=>x.name)])});
 let art=rnd(artifacts);puzzles.push({q:`EQUIPMENT LOCK: ${art.clue}`,a:art.name,o:sh([art.name,...pickOthers(artifacts,art,3).map(x=>x.name)])});
 let ev=rnd(events);puzzles.push({q:`DATE LOCK: In what year did “${ev[0]}” occur?`,a:String(ev[1]),num:true});
 let pc=rnd(characters.filter(x=>x.powers.length));let power=rnd(pc.powers);
 puzzles.push({q:`BIOMETRIC LOCK: Whose file contains “${power}”?`,a:pc.name,o:sh([pc.name,...pickOthers(characters,pc,3).map(x=>x.name)])});
 puzzles=sh(puzzles);let i=0,mist=0;
 function render(msg=""){
   if(i>=puzzles.length){let gain=Math.max(30,90-mist*10);prog.xp+=gain;prog.rooms++;save();screen.innerHTML=`<section class="mission"><p class="eyebrow">ESCAPE CONFIRMED</p><h1>${esc(theme)} cleared.</h1><p>${mist} mistake${mist===1?"":"s"}.</p><div class="reward">+${gain} XP</div><div class="row"><button class="btn primary" id="again">Generate another room</button><button class="btn" id="back">Terminal</button></div></section>`;document.getElementById("again").onclick=escapeGame;document.getElementById("back").onclick=home;return}
   let p=puzzles[i],input=p.num?`<form class="form" id="nf"><input id="ni" inputmode="numeric" placeholder="Enter year" required><button class="btn primary">Unlock</button></form>`:`<div class="choices">${p.o.map(x=>`<button class="choice" data-a="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
   screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">ESCAPE PROTOCOL · ${esc(theme)}</p><h1>Lock ${i+1}/${puzzles.length}</h1></div></div><section class="mission"><h2>${esc(p.q)}</h2>${input}<p class="feedback" id="fb">${esc(msg)}</p></section>`;
   document.getElementById("b").onclick=home;
   function check(a){if(norm(a)===norm(p.a)){i++;render("ACCESS GRANTED")}else{mist++;document.getElementById("fb").textContent="ACCESS DENIED. Try again."}}
   document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>check(b.dataset.a));
   if(document.getElementById("nf"))document.getElementById("nf").onsubmit=e=>{e.preventDefault();check(document.getElementById("ni").value)}
 }
 render();
}
function guessGame(){
 prog.games++;save();let c=fresh(),clues=sh([
 `CLASSIFICATION: Species — ${c.species}`,
 `AFFILIATION: ${rnd(c.aff)}`,
 `KNOWN ASSOCIATE: ${rnd(c.assoc)}`,
 `CAPABILITY: ${rnd(c.powers)}`,
 `LOCATION OF INTEREST: ${rnd(c.loc)}`,
 `FIRST MCU APPEARANCE YEAR: ${c.year}`,
 `EQUIPMENT: ${c.gear.length?rnd(c.gear):"No signature equipment listed"}`,
 `ARCHIVED QUOTE: “${c.quote}”`
 ]).slice(0,4);clues.push(`ALIAS: ${rnd(c.aliases)}`);let n=1,done=false;
 function pts(){return [10,8,6,4,2][Math.min(n-1,4)]}
 function render(msg=""){
 screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">IDENTITY ANALYSIS</p><h1>Unknown subject</h1></div><div class="reward">STREAK ${prog.streak}</div></div><section class="mission"><div class="reward">${pts()} points available</div><div class="clues">${clues.map((x,i)=>`<div class="clue ${i<n?"":"hidden"}"><span>CLUE ${i+1}</span><div>${i<n?esc(x):"████████████████"}</div></div>`).join("")}</div><form class="form" id="gf"><input id="gi" placeholder="Character name or alias" ${done?"disabled":""} required><button class="btn primary" ${done?"disabled":""}>Submit</button></form><div class="row"><button class="btn" id="more" ${n>=5||done?"disabled":""}>Reveal another clue</button>${done?'<button class="btn primary" id="next">Next subject</button>':""}</div><p class="feedback" id="fb">${esc(msg)}</p></section>`;
 document.getElementById("b").onclick=home;document.getElementById("more").onclick=()=>{n++;render()};if(done)document.getElementById("next").onclick=guessGame;
 document.getElementById("gf").onsubmit=e=>{e.preventDefault();let a=document.getElementById("gi").value,ok=[c.name,...c.aliases].some(x=>norm(x)===norm(a));if(ok){done=true;let gain=pts()*8;prog.xp+=gain;prog.guessed++;prog.streak++;prog.best=Math.max(prog.best,prog.streak);prog.recent=[...prog.recent,c.name].slice(-12);save();render(`IDENTITY CONFIRMED: ${c.name} · +${gain} XP`)}else{prog.streak=0;save();if(n>=5){done=true;render(`SUBJECT REVEALED: ${c.name}`)}else document.getElementById("fb").textContent="IDENTITY REJECTED. Try again or reveal another clue."}}
 }
 render();
}
function dbGame(){
 prog.games++;save();let s=fresh(),cl=sh([
 `The subject has been connected to ${rnd(s.aff)}.`,
 `A recovered file lists ${rnd(s.assoc)} as a known associate.`,
 `The subject has demonstrated ${rnd(s.powers)}.`,
 `The investigation references ${rnd(s.loc)}.`,
 `The subject's first MCU appearance year is ${s.year}.`,
 s.gear.length?`Equipment analysis mentions ${rnd(s.gear)}.`:`No signature equipment appears in the recovered manifest.`,
 `Classification lists the subject as ${s.species}.`
 ]).slice(0,4);let q="",sel="";
 function filtered(){if(!q)return characters;let n=norm(q);return characters.filter(c=>norm([c.name,...c.aliases,...c.aff,...c.powers,...c.gear,...c.assoc,...c.loc,c.species,c.year].join(" ")).includes(n))}
 function render(msg=""){let rs=filtered();screen.innerHTML=`<div class="missionhead"><button class="back" id="b">← Terminal</button><div><p class="eyebrow">CLASSIFIED DATABASE</p><h1>Active case</h1></div></div><section class="casegrid"><aside class="case"><p class="eyebrow">ACTIVE INVESTIGATION</p><h2>Identify the unknown subject.</h2><p>Use the evidence and search the personnel database.</p><div class="evidence">${cl.map((x,i)=>`<div><span>EVIDENCE ${i+1}</span><p>${esc(x)}</p></div>`).join("")}</div></aside><section class="db"><form class="search" id="sf"><input id="si" placeholder="Search name, alias, power, team, location…" value="${esc(q)}"><button class="btn">Search</button></form><div class="results">${rs.map(c=>`<button class="person ${sel===c.name?"sel":""}" data-p="${esc(c.name)}"><strong>${esc(c.name)}</strong><small>${esc(c.aliases[0]||"")}</small><p>${esc(c.species)} · ${esc(c.aff.join(", "))}<br>${esc(c.powers.slice(0,2).join(", "))}</p></button>`).join("")}</div><div class="row"><button class="btn primary" id="acc" ${sel?"":"disabled"}>Submit selected identity</button></div><p class="feedback" id="fb">${esc(msg)}</p></section></section>`;
 document.getElementById("b").onclick=home;document.getElementById("sf").onsubmit=e=>{e.preventDefault();q=document.getElementById("si").value;render()};document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{sel=b.dataset.p;render()});document.getElementById("acc").onclick=()=>{if(sel===s.name){prog.xp+=80;prog.cases++;prog.recent=[...prog.recent,s.name].slice(-12);save();screen.innerHTML=`<section class="mission"><p class="eyebrow">CASE CLOSED</p><h1>${esc(s.name)} identified.</h1><div class="reward">+80 XP</div><div class="row"><button class="btn primary" id="new">Generate new case</button><button class="btn" id="home">Terminal</button></div></section>`;document.getElementById("new").onclick=dbGame;document.getElementById("home").onclick=home}else document.getElementById("fb").textContent="IDENTITY REJECTED. Re-check the evidence."}}
 render();
}
document.getElementById("homeBtn").onclick=home;
home();
</script>
</body>
</html>
